name: Publish Ruby SDK to RubyGems

on:
  push:
    tags:
      - "ruby-v*"

permissions:
  contents: read

concurrency:
  group: ruby-rubygems-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    uses: ./.github/workflows/ruby-compatibility.yml

  publish:
    name: Publish Ruby SDK
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: rubygems
    permissions:
      contents: read
      # RubyGems trusted publishing exchanges this OIDC token for a short-lived
      # API key, so the publishing job needs it and nothing else does.
      id-token: write

    steps:
      - name: Validate and extract the release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^ruby-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Expected a stable release tag such as ruby-v1.0.0" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${BASH_REMATCH[1]}" >> "${GITHUB_ENV}"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby

      - name: Download the canonical gem
        uses: actions/download-artifact@v8
        with:
          name: oppex-integration-sdk-canonical-ruby
          path: ${{ runner.temp }}/canonical-ruby

      - name: Verify the canonical gem matches the release tag
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/canonical-ruby"
          sha256sum --check ./*.sha256
          expected="oppex_sdk-${RELEASE_VERSION}.gem"
          test -s "${expected}"
          echo "GEM_FILE=${RUNNER_TEMP}/canonical-ruby/${expected}" >> "${GITHUB_ENV}"

      # No stored credential: the action trades the OIDC token for a short-lived
      # key exported as GEM_HOST_API_KEY. Such a key is also exempt from the
      # OTP that the gemspec's rubygems_mfa_required demands of a human push.
      # The trusted publisher registered on RubyGems pins this repository, this
      # workflow filename, and the `rubygems` environment above, so all three
      # must keep matching for a push to be accepted.
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      # Push exactly the bytes the compatibility workflow proved, without
      # rebuilding.
      - name: Push to RubyGems
        shell: bash
        run: gem push "${GEM_FILE}"
