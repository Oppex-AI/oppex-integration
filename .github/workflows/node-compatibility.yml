name: Node compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library-package:
    name: Build and import the ${{ matrix.variant }} variant on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    container:
      image: node:${{ matrix.node }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: legacy
            node: "8"
          - variant: legacy
            node: "16"
          - variant: legacy
            node: "17"
          - variant: modern
            node: "18"
          - variant: modern
            node: "20"
          - variant: modern
            node: "22"
          - variant: modern
            node: "24"
          - variant: modern
            node: "26"

    steps:
      # One checkout, one branch — both variants are built from it via
      # node/scripts/build-variant.sh, which stages the requested variant's
      # package.json/tsconfig.json/transport.ts before installing and building. No
      # cross-branch ref is needed anywhere in this workflow anymore. Runs the whole
      # job inside the official node:${{ matrix.node }} image — the same images
      # validated locally via oppex-integration-testing/docker — rather than relying on
      # actions/setup-node's ability to provision Node 8. actions/checkout and other
      # JS-based actions still work normally inside a job container: the runner injects
      # its own Node for running actions, separate from the container's own PATH Node
      # used by the run: steps below.
      - name: Check out
        uses: actions/checkout@v7

      - name: Show tool versions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Build and test the ${{ matrix.variant }} variant
        shell: bash
        run: node/scripts/build-variant.sh ${{ matrix.variant }}

      - name: Verify the Node-8 compile-time guardrail
        if: matrix.variant == 'legacy'
        shell: bash
        working-directory: node
        run: |
          set -euo pipefail
          cp src/internal/transport.legacy.ts "${RUNNER_TEMP}/transport.legacy.ts.bak"
          printf '\nfetch("https://example.com");\n' >> src/internal/transport.legacy.ts
          if ./scripts/build-variant.sh legacy; then
            echo "legacy must fail to compile when its transport source calls fetch() directly" >&2
            cp "${RUNNER_TEMP}/transport.legacy.ts.bak" src/internal/transport.legacy.ts
            exit 1
          fi
          cp "${RUNNER_TEMP}/transport.legacy.ts.bak" src/internal/transport.legacy.ts

      - name: Pack tarball
        shell: bash
        working-directory: node
        run: npm pack --pack-destination "${RUNNER_TEMP}"

      - name: Install and run external consumer via npm
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir="${RUNNER_TEMP}/consumer-npm"
          mkdir -p "${consumer_dir}"
          cp .github/smoke/node/consumer.js "${consumer_dir}/"
          tarball=$(ls "${RUNNER_TEMP}"/oppex-integration-sdk-*.tgz)
          (cd "${consumer_dir}" && npm init -y >/dev/null && npm install "${tarball}")
          node "${consumer_dir}/consumer.js" | tee "${RUNNER_TEMP}/consumer-npm-output.txt"
          grep --fixed-strings "EXTERNAL_CONSUMER_OK" "${RUNNER_TEMP}/consumer-npm-output.txt"

      # pnpm/yarn via corepack need a modern Node to run their own CLI — skipped on the
      # Node 8 entry, matching how the Java workflow's Java-7 entry gets its own special
      # handling rather than being forced through the same tooling as every other entry.
      - name: Install and run external consumer via pnpm
        if: matrix.node != '8'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          consumer_dir="${RUNNER_TEMP}/consumer-pnpm"
          mkdir -p "${consumer_dir}"
          cp .github/smoke/node/consumer.js "${consumer_dir}/"
          tarball=$(ls "${RUNNER_TEMP}"/oppex-integration-sdk-*.tgz)
          (cd "${consumer_dir}" && npm init -y >/dev/null && pnpm install "${tarball}")
          node "${consumer_dir}/consumer.js" | tee "${RUNNER_TEMP}/consumer-pnpm-output.txt"
          grep --fixed-strings "EXTERNAL_CONSUMER_OK" "${RUNNER_TEMP}/consumer-pnpm-output.txt"

      - name: Install and run external consumer via yarn
        if: matrix.node != '8'
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir="${RUNNER_TEMP}/consumer-yarn"
          mkdir -p "${consumer_dir}"
          cp .github/smoke/node/consumer.js "${consumer_dir}/"
          tarball=$(ls "${RUNNER_TEMP}"/oppex-integration-sdk-*.tgz)
          (cd "${consumer_dir}" && npm init -y >/dev/null && yarn add "${tarball}")
          node "${consumer_dir}/consumer.js" | tee "${RUNNER_TEMP}/consumer-yarn-output.txt"
          grep --fixed-strings "EXTERNAL_CONSUMER_OK" "${RUNNER_TEMP}/consumer-yarn-output.txt"

      - name: Upload package tarball
        uses: actions/upload-artifact@v7
        with:
          name: oppex-integration-sdk-node-${{ matrix.variant }}-${{ matrix.node }}
          path: ${{ runner.temp }}/oppex-integration-sdk-*.tgz
          if-no-files-found: error
          retention-days: 7
