# Convenience runner for local multi-interpreter checks. CI is authoritative:
# see .github/workflows/python-compatibility.yml.
#
# tox 4 cannot create a py27 environment; use `tox<4` with `virtualenv<20.22`
# when a Python 2.7 interpreter is available locally.
[tox]
envlist = py27,py35,py38,py311,py313,py314
skip_missing_interpreters = true

[testenv]
# The SDK and its tests are standard library only.
deps =
commands =
    python -m compileall -q {toxinidir}/src {toxinidir}/tests {toxinidir}/examples
    python -m unittest discover -s {toxinidir}/tests -t {toxinidir}
