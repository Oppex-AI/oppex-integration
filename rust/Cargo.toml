[package]
name = "oppex-integration-sdk"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Oppex incident API client: post incidents to Oppex from Rust applications."
documentation = "https://docs.rs/oppex-integration-sdk"
repository = "https://github.com/Oppex-AI/oppex-integration"
readme = "README.md"
license = "Apache-2.0"
keywords = ["oppex", "incident", "alerting", "observability", "sdk"]
categories = ["api-bindings"]
# The published crate carries the library and the metadata a consumer needs, and
# nothing else. The smoke consumer in CI depends on the packaged directory, so a
# file missing from this list fails the build before it can reach crates.io.
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "oppex_sdk"
path = "src/lib.rs"

[dependencies]
# Blocking HTTP with rustls TLS and a connection pool, and no async runtime.
ureq = "3"
# Response parsing only. The request payload is built field by field.
serde_json = "1"
# The de facto standard logging facade. It is a no-op until the host installs a
# logger, so this SDK never decides where a host's logs go.
log = "0.4"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
