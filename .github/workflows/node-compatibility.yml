name: Node compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library-package:
    name: Build and import the ${{ matrix.variant }} variant on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: legacy
            node: "8"
          - variant: legacy
            node: "16"
          - variant: legacy
            node: "17"
          - variant: modern
            node: "18"
          - variant: modern
            node: "20"
          - variant: modern
            node: "22"
          - variant: modern
            node: "24"
          - variant: modern
            node: "26"

    steps:
      # One checkout, one branch — both variants are built from it via
      # node/scripts/build-variant.sh, which stages the requested variant's
      # package.json/tsconfig.json/transport.ts before installing and building. No
      # cross-branch ref is needed anywhere in this workflow anymore.
      - name: Check out
        uses: actions/checkout@v7

      # Runs directly on the bare ubuntu-latest runner rather than inside a
      # node:${{ matrix.node }} container. This used to run in a container so Node 8
      # would be available at all, but that introduced a real problem: actions/checkout
      # and this step run as the runner's own user, while a container's run: steps run
      # as that image's own (different) user looking at the same files — which trips
      # git's ownership check ("detected dubious ownership", CVE-2022-24765) and broke
      # build-variant.sh's own `git rev-parse --show-toplevel` call. setup-node fetches
      # any released Node version, including EOL ones like 8, straight from
      # nodejs.org's dist archive (which never removes old tarballs) — no container
      # needed, and no user-mismatch problem to work around. The genuine value a real
      # node:X Docker image adds beyond what setup-node gives you (an environment
      # that's bit-for-bit what a consumer's own Docker deployment would run) is still
      # covered — see node/scripts/docker-sanity.sh, a local, pre-release sweep across
      # real node:X containers for every supported version, not part of automated CI.
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show tool versions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Build and test the ${{ matrix.variant }} variant
        shell: bash
        run: node/scripts/build-variant.sh ${{ matrix.variant }}

      - name: Pack tarball
        shell: bash
        working-directory: node
        run: npm pack --pack-destination "${RUNNER_TEMP}"

      - name: Install and run external consumer via npm
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir="${RUNNER_TEMP}/consumer-npm"
          mkdir -p "${consumer_dir}"
          cp .github/smoke/node/consumer.js "${consumer_dir}/"
          tarball=$(ls "${RUNNER_TEMP}"/oppex-integration-sdk-*.tgz)
          (cd "${consumer_dir}" && npm init -y >/dev/null && npm install "${tarball}")
          node "${consumer_dir}/consumer.js" | tee "${RUNNER_TEMP}/consumer-npm-output.txt"
          grep --fixed-strings "EXTERNAL_CONSUMER_OK" "${RUNNER_TEMP}/consumer-npm-output.txt"

      # pnpm/yarn via corepack need a modern Node to run their own CLI — skipped on the
      # Node 8 entry, matching how the Java workflow's Java-7 entry gets its own special
      # handling rather than being forced through the same tooling as every other entry.
      - name: Install and run external consumer via pnpm
        if: matrix.node != '8'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          consumer_dir="${RUNNER_TEMP}/consumer-pnpm"
          mkdir -p "${consumer_dir}"
          cp .github/smoke/node/consumer.js "${consumer_dir}/"
          tarball=$(ls "${RUNNER_TEMP}"/oppex-integration-sdk-*.tgz)
          (cd "${consumer_dir}" && npm init -y >/dev/null && pnpm install "${tarball}")
          node "${consumer_dir}/consumer.js" | tee "${RUNNER_TEMP}/consumer-pnpm-output.txt"
          grep --fixed-strings "EXTERNAL_CONSUMER_OK" "${RUNNER_TEMP}/consumer-pnpm-output.txt"

      - name: Install and run external consumer via yarn
        if: matrix.node != '8'
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir="${RUNNER_TEMP}/consumer-yarn"
          mkdir -p "${consumer_dir}"
          cp .github/smoke/node/consumer.js "${consumer_dir}/"
          tarball=$(ls "${RUNNER_TEMP}"/oppex-integration-sdk-*.tgz)
          (cd "${consumer_dir}" && npm init -y >/dev/null && yarn add "${tarball}")
          node "${consumer_dir}/consumer.js" | tee "${RUNNER_TEMP}/consumer-yarn-output.txt"
          grep --fixed-strings "EXTERNAL_CONSUMER_OK" "${RUNNER_TEMP}/consumer-yarn-output.txt"

      - name: Upload package tarball
        uses: actions/upload-artifact@v7
        with:
          name: oppex-integration-sdk-node-${{ matrix.variant }}-${{ matrix.node }}
          path: ${{ runner.temp }}/oppex-integration-sdk-*.tgz
          if-no-files-found: error
          retention-days: 7
